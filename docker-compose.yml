services:

  postgres:
    image: postgres:17
    container_name: futflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5431:5432"

    volumes:
      - futflow_postgres_data:/var/lib/postgresql/data

    restart: always

  futflow:
    image: juniorsouza05/futflow:0.0.2
    container_name: futflow

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

    restart: always

volumes:
  futflow_postgres_data: