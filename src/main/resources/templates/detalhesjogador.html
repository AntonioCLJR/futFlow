<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'FutFlow · ' + ${jogador.nome}">FutFlow · Jogador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-content">
        <span class="crest">⚽</span>
        <div>
            <h1>FutFlow</h1>
            <p class="subtitle">Ficha do jogador</p>
        </div>
    </div>
</header>

<main class="content">

    <a class="btn-back" th:href="@{/jogadores/ui/listar}">&larr; Voltar para a lista</a>

    <div class="player-card">

        <div class="player-hero">
            <span class="jersey jersey-lg" th:text="${jogador.numeroDaCamisa}"></span>
            <div>
                <h2 th:text="${jogador.nome}">Nome do Jogador</h2>
                <span class="pos-badge" th:text="${jogador.posicao}" th:attr="data-pos=${jogador.posicao}"></span>
            </div>
        </div>

        <div class="player-info-grid">
            <div class="info-block">
                <span class="info-label">Idade</span>
                <span class="info-value" th:text="${jogador.idade} + ' anos'"></span>
            </div>
            <div class="info-block">
                <span class="info-label">Nacionalidade</span>
                <span class="info-value" th:text="${jogador.nacionalidade}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">Email</span>
                <span class="info-value" th:text="${jogador.email}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">ID no sistema</span>
                <span class="info-value" th:text="${jogador.id}"></span>
            </div>
        </div>

        <div class="club-section" th:if="${jogador.clube != null}">
            <h3>Clube</h3>
            <div class="player-info-grid">
                <div class="info-block">
                    <span class="info-label">Nome</span>
                    <span class="info-value" th:text="${jogador.clube.nomeClube}"></span>
                </div>
                <div class="info-block">
                    <span class="info-label">Federação</span>
                    <span class="info-value" th:text="${jogador.clube.federacao}"></span>
                </div>
                <div class="info-block">
                    <span class="info-label">País</span>
                    <span class="info-value" th:text="${jogador.clube.pais}"></span>
                </div>
                <div class="info-block">
                    <span class="info-label">Fundado em</span>
                    <span class="info-value" th:text="${jogador.clube.anoDeCriacao}"></span>
                </div>
            </div>
        </div>

        <div class="player-actions">
            <a class="btn-edit" th:href="@{/jogadores/ui/alterar/{id}(id=${jogador.id})}">Editar Jogador</a>
            <a class="btn-delete" th:href="@{/jogadores/ui/deletar/{id}(id=${jogador.id})}">Deletar Jogador</a>
        </div>

    </div>
</main>
</body>
</html>
