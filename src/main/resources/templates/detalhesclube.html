<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'FutFlow · ' + ${clube.nomeClube}">FutFlow · Clube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-content">
        <div class="topbar-left">
            <span class="crest">🏆</span>
            <div>
                <h1>FutFlow</h1>
                <p class="subtitle">Ficha do clube</p>
            </div>
        </div>
    </div>
</header>

<main class="content">

    <a class="btn-back" th:href="@{/clubes/ui/listar}">&larr; Voltar para a lista</a>

    <div class="player-card">

        <div class="player-hero">
            <div class="founded-badge">
                <span class="year" th:text="${clube.anoDeCriacao}"></span>
                <span class="label">Fundado</span>
            </div>
            <div>
                <h2 th:text="${clube.nomeClube}">Nome do Clube</h2>
                <span class="info-tag" th:text="${clube.pais}"></span>
            </div>
        </div>

        <div class="player-info-grid">
            <div class="info-block">
                <span class="info-label">Federação</span>
                <span class="info-value" th:text="${clube.federacao}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">Campeonato Nacional</span>
                <span class="info-value" th:text="${clube.campeonatoNacional}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">País</span>
                <span class="info-value" th:text="${clube.pais}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">Fundado em</span>
                <span class="info-value" th:text="${clube.anoDeCriacao}"></span>
            </div>
            <div class="info-block">
                <span class="info-label">ID no sistema</span>
                <span class="info-value" th:text="${clube.id}"></span>
            </div>
        </div>

        <div class="club-section">
            <h3>Elenco</h3>

            <table th:if="${not #lists.isEmpty(clube.jogador)}">
                <thead>
                <tr>
                    <th>Camisa</th>
                    <th>Nome</th>
                    <th>Posição</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="jogador : ${clube.jogador}">
                    <td><span class="jersey" th:text="${jogador.numeroDaCamisa}"></span></td>
                    <td class="name-cell" th:text="${jogador.nome}"></td>
                    <td><span class="pos-badge" th:text="${jogador.posicao}" th:attr="data-pos=${jogador.posicao}"></span></td>
                    <td class="actions-cell">
                        <a class="icon-btn icon-btn-details" th:href="@{/jogadores/ui/detalhes/{id}(id=${jogador.id})}" title="Ver jogador">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <p th:if="${#lists.isEmpty(clube.jogador)}" class="empty-state">Nenhum jogador cadastrado neste clube ainda.</p>
        </div>

        <div class="player-actions">
            <a class="btn-edit" th:href="@{/clubes/ui/alterar/{id}(id=${clube.id})}">Editar Clube</a>
            <a class="btn-delete" th:href="@{/clubes/ui/deletar/{id}(id=${clube.id})}">Deletar Clube</a>
        </div>

    </div>

</main>

</body>
</html>
